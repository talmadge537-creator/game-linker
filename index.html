<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Game Linker</title>
</head>

<body>

    <h2>Roblox Game Linker</h2>

    <input
        id="link"
        type="text"
        placeholder="https://www.roblox.com/games/4623386862/Piggy"
    >

    <button onclick="enviar()">Generate</button>

    <script>
        async function enviar() {
            const link = document.getElementById("link").value.trim();

            const match = link.match(/games\/(\d+)/);

            if (!match) {
                alert("Invalid Roblox game link");
                return;
            }

            const placeId = match[1];

            try {
                const res = await fetch(
                    "https://game-linker-a90z.onrender.com/gerar",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ placeId })
                    }
                );

                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                }

                const blob = await res.blob();
                const url = URL.createObjectURL(blob);

                const a = document.createElement("a");
                a.href = url;
                a.download = "game.rbxlx";

                document.body.appendChild(a);
                a.click();
                a.remove();

                URL.revokeObjectURL(url);

            } catch (error) {
                console.error(error);
                alert("Error connecting to the server.");
            }
        }
    </script>

</body>
</html>
