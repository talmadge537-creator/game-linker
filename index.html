<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Place Exporter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 80px auto;
            padding: 20px;
        }

        input {
            margin: 15px 0;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #status {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h2>Roblox Place Exporter</h2>

    <p>
        Export your place from Roblox Studio as an .rbxlx or .rbxl file,
        then select it below.
    </p>

    <input
        id="placeFile"
        type="file"
        accept=".rbxlx,.rbxl"
    >

    <br>

    <button id="uploadButton">
        Upload Place
    </button>

    <p id="status"></p>

    <script>
        const SERVER =
            "https://game-linker-a90z.onrender.com";

        const fileInput = document.getElementById("placeFile");
        const button = document.getElementById("uploadButton");
        const status = document.getElementById("status");

        button.addEventListener("click", async () => {
            const file = fileInput.files[0];

            if (!file) {
                status.textContent = "Select an .rbxlx or .rbxl file first.";
                return;
            }

            const formData = new FormData();
            formData.append("place", file);

            button.disabled = true;
            status.textContent = "Uploading...";

            try {
                const response = await fetch(
                    SERVER + "/upload",
                    {
                        method: "POST",
                        body: formData
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Upload failed.");
                }

                status.textContent =
                    "Upload complete! Downloading your place...";

                window.location.href = SERVER + "/download";

            } catch (error) {
                console.error(error);
                status.textContent =
                    "Error: " + error.message;
            } finally {
                button.disabled = false;
            }
        });
    </script>

</body>
</html>
